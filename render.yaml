# Render blueprint: runs the Express server with a persistent disk so orders and accounts survive restarts.
services:
  - type: web
    name: kumud-boutique
    runtime: node
    plan: starter            # persistent disks need a paid instance
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/meta
    envVars:
      - key: KUMUD_DB
        value: /var/data/kumud.db
      - key: MYSQL_URL
        sync: false           # hosted MySQL connection string for bookings + admin portal
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false           # you enter this in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true   # encrypts 2FA secrets + signs CSRF tokens
      - key: REQUIRE_ADMIN_MFA
        value: '1'
      - key: BASE_URL
        sync: false           # https://your-domain
      - key: ALERT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false           # browser key, referrer-restricted
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false           # server key, IP-restricted
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
    disk:
      name: kumud-data
      mountPath: /var/data
      sizeGB: 1
