# Render blueprint: runs the Express server with a persistent disk so orders and accounts survive restarts.
services:
  - type: web
    name: kumud-boutique
    runtime: node
    plan: starter            # persistent disks need a paid instance
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/meta
    envVars:
      - key: KUMUD_DB
        value: /var/data/kumud.db
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false           # you enter this in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true   # encrypts 2FA secrets + signs CSRF tokens
      - key: REQUIRE_ADMIN_MFA
        value: '1'
    # Optional extras you can add later in the Render dashboard (Environment): BASE_URL, ALERT_EMAIL + RESEND_API_KEY + MAIL_FROM,
    # MYSQL_URL (bookings), GOOGLE_MAPS_API_KEY / GOOGLE_MAPS_SERVER_KEY, RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET.
    disk:
      name: kumud-data
      mountPath: /var/data
      sizeGB: 1
